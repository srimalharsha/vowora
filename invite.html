</style></head><body><main class="scene"><div class="glow"></div><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><article class="card"><div class="frame"><div class="eyebrow">WITH THE BLESSINGS OF OUR FAMILIES</div><div class="guest" id="guestName"></div><div class="eyebrow">YOU ARE CORDIALLY INVITED TO CELEBRATE THE WEDDING OF</div><div class="couple"><span id="bride"></span><span class="amp"> &amp; </span><span id="groom"></span></div><div class="rule"></div><div class="details" id="details"></div><div class="personal" id="family"></div><div class="eyebrow" style="margin-top:18px">WE LOOK FORWARD TO CELEBRATING WITH YOU</div></div><div class="buttons"><a class="btn gold" id="locationBtn" target="_blank" rel="noopener">LOCATION & DIRECTIONS</a><button class="btn" id="rsvpOpen">RSVP · CONFIRM</button></div><section class="rsvp" id="rsvp"><h3 style="text-align:center;font-weight:normal">ඔබ සහභාගී වෙනවාද?</h3><label for="answer">ඔබගේ පිළිතුර</label><select id="answer"><option value="yes">ඔව්, මම සහභාගී වෙනවා</option><option value="no">කණගාටුයි, මට සහභාගී විය නොහැක</option></select><label for="count">සහභාගී වන පුද්ගලයන් ගණන</label><input id="count" type="number" min="1" max="20" value="1"><div class="buttons"><button class="btn" id="sendRsvp">Confirm RSVP</button></div><div class="status" id="rsvpMsg"></div><div class="buttons" id="whatsappWrap" style="display:none"><a class="btn gold" id="whatsappBtn" target="_blank" rel="noopener">Send confirmation on WhatsApp</a></div></section></article></main><div class="foot">VOWORA · A MOMENT TO REMEMBER</div>
<script type="module">

const app=initializeApp({apiKey:"AIzaSyBodeTb_8XTiVO4ABEI8M5Ea30gFXrfrGc",authDomain:"vowora-6b0d1.firebaseapp.com",projectId:"vowora-6b0d1",storageBucket:"vowora-6b0d1.firebasestorage.app",messagingSenderId:"645328995192",appId:"1:645328995192:web:f8a6a8f3bc07f7f0dffe8d"},"voworaGuestInvitation");const db=getFirestore(app),p=new URLSearchParams(location.search),portal=p.get("p"),guest=p.get("g"),$=id=>document.getElementById(id);let w,g;

try{if(!portal||!guest)throw Error("invalid");const [ws,gs]=await Promise.all([getDoc(doc(db,"couplePortals",portal)),getDoc(doc(db,"couplePortals",portal,"guests",guest))]);if(!ws.exists()||!gs.exists())throw Error("missing");w=ws.data();g=gs.data();if(Date.now()>=w.expiresAt.toDate().getTime())throw Error("expired");$("guestName").textContent="Dear "+g.guestName;$("family").textContent=g.familyNames||"";$("bride").textContent=w.brideName;$("groom").textContent=w.groomName;$("details").innerHTML=esc(w.eventDate)+"<br>"+esc(w.eventTime)+"<br>"+esc(w.venue);$("locationBtn").href=mapsUrl(w.location||w.venue);if(g.rsvpStatus==="yes"||g.rsvpStatus==="no"){$("rsvpMsg").textContent="ඔබගේ පිළිතුර දැනටමත් ලැබී ඇත. අවශ්‍ය නම් නැවත වෙනස් කළ හැකිය.";$("answer").value=g.rsvpStatus;$("count").value=Math.max(1,Number(g.attendeeCount)||1)}}catch(e){document.querySelector(".card").innerHTML="<h2>Invitation එක විවෘත කළ නොහැක</h2><p>මෙම Invitation Link එක වැරදි හෝ කල් ඉකුත් වී ඇත.</p><a class='btn' href='album.html'>VOWORA Album</a>"}
