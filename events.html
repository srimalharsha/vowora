<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOWORA | Events Gallery</title><style>
*{box-sizing:border-box}body{margin:0;background:#fbf8f3;color:#302a27;font-family:Georgia,serif}.nav{padding:18px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #e9e0d7}.logo{font:bold 24px Georgia;letter-spacing:5px;color:#6e3449;text-decoration:none}.btn{display:inline-block;background:#b58a54;color:white;padding:11px 15px;font:12px Arial;text-decoration:none}.hero{text-align:center;padding:48px 18px 20px}.eyebrow{font:11px Arial;letter-spacing:3px;color:#b58a54}h1{font-size:clamp(32px,5vw,52px);font-weight:normal}.sub{font:14px/1.8 Arial;color:#796f68;max-width:680px;margin:auto}.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:20px}.filter{border:1px solid #d8c8b8;background:white;padding:9px 14px;border-radius:22px}.filter.active{background:#6e3449;color:white}.grid{max-width:1150px;margin:20px auto 60px;padding:0 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid #e9e0d7;padding:10px}.card img,.placeholder{width:100%;height:230px;object-fit:cover;background:#eee5dc}.placeholder{display:grid;place-items:center;font-size:50px}.card h2{font-size:20px;font-weight:normal;margin:13px 5px 6px}.card p{font:12px/1.7 Arial;color:#796f68;margin:5px}.card .btn{margin:10px 5px}.empty{text-align:center;grid-column:1/-1;padding:40px;color:#796f68;font:14px Arial}.footer{text-align:center;padding:25px;font:11px Arial;color:#796f68;background:#eee4da}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="nav"><a class="logo" href="index.html">VOWORA</a><a class="btn" href="gallery.html">Wedding Gallery</a></header><section class="hero"><div class="eyebrow">CELEBRATE EVERY MOMENT</div><h1>Special Events Gallery</h1><p class="sub">Birthday, Engagement, Grand Opening, Sports Meet සහ ඔබගේ සියලුම විශේෂ අවස්ථා සඳහා ආරාධනා.</p></section><div class="filters"><button class="filter active" data-type="all">All Events</button><button class="filter" data-type="birthday">Birthday</button><button class="filter" data-type="engagement">Engagement</button><button class="filter" data-type="grand-opening">Grand Opening</button><button class="filter" data-type="sports-meet">Sports Meet</button><button class="filter" data-type="other">Other</button></div><main class="grid" id="events"><div class="empty">Loading invitations...</div></main><footer class="footer">© 2026 VOWORA · Powered by SriHarsha Digital</footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";import{getFirestore,collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBodeTb_8XTiVO4ABEI8M5Ea30gFXrfrGc",authDomain:"vowora-6b0d1.firebaseapp.com",projectId:"vowora-6b0d1",storageBucket:"vowora-6b0d1.firebasestorage.app",messagingSenderId:"645328995192",appId:"1:645328995192:web:f8a6a8f3bc07f7f0dffe8d"};
const app=initializeApp(cfg,"voworaEventsGallery"),db=getFirestore(app),box=document.getElementById("events");let all=[];
const labels={birthday:"Birthday Party",engagement:"Engagement","grand-opening":"Grand Opening","sports-meet":"Sports Meet",anniversary:"Anniversary",graduation:"Graduation","baby-shower":"Baby Shower",corporate:"Corporate Event",other:"Other Event"};
function render(type="all"){box.innerHTML="";const list=all.filter(x=>type==="all"||x.eventType===type||(type==="other"&&!["birthday","engagement","grand-opening","sports-meet","anniversary","graduation","baby-shower","corporate"].includes(x.eventType)));if(!list.length){box.innerHTML='<div class="empty">මෙම වර්ගයට අදාළ Published Invitations දැනට නැත.</div>';return}list.forEach(x=>{const card=document.createElement("article");card.className="card";if(x.image){const im=document.createElement("img");im.src=x.image;im.alt=x.title||"Event";card.append(im)}else{const ph=document.createElement("div");ph.className="placeholder";ph.textContent="✦";card.append(ph)}const h=document.createElement("h2");h.textContent=x.title||"Special Event";const p=document.createElement("p");p.textContent=[labels[x.eventType]||"Event",x.eventDate,x.venue].filter(Boolean).join(" · ");const a=document.createElement("a");a.className="btn";a.href="event-invite.html?id="+encodeURIComponent(x.id);a.textContent="View Invitation";card.append(h,p,a);box.append(card)})}
try{const snap=await getDocs(query(collection(db,"eventInvitations"),where("isActive","==",true)));all=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){box.innerHTML='<div class="empty">Invitations ලබාගැනීමට නොහැක. Firestore Rules Publish කර ඇතිදැයි පරීක්ෂා කරන්න.</div>'}
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.type)});
</script></body></html>
