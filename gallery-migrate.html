<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOWORA Gallery Speed Setup</title><style>body{font:15px Arial;background:#fffaf8;color:#302a27;padding:20px}.box{max-width:680px;margin:30px auto;background:white;border:1px solid #eadbd5;border-radius:16px;padding:24px}input,button{padding:12px;margin:6px 0;border:1px solid #dfd2cc;border-radius:8px;width:100%;box-sizing:border-box}button{background:#7b284f;color:white;font-weight:bold}#log{white-space:pre-wrap;line-height:1.7}</style></head><body><main class="box"><h1>VOWORA Gallery Speed Setup</h1><p>මෙය එක්වරක් පමණක් ක්‍රියාත්මක කර පැරණි Published Invitations සඳහා කුඩා Gallery thumbnails සාදයි. මුල් Invitation දත්ත වෙනස් නොකරයි.</p><section id="login"><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Admin Login</button></section><section id="work" hidden><button id="runBtn">Migrate Existing Gallery Invitations</button><p id="log"></p></section></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import{getFirestore,collection,getDocs,doc,setDoc,query,where,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBodeTb_8XTiVO4ABEI8M5Ea30gFXrfrGc",authDomain:"vowora-6b0d1.firebaseapp.com",projectId:"vowora-6b0d1",storageBucket:"vowora-6b0d1.firebasestorage.app",messagingSenderId:"645328995192",appId:"1:645328995192:web:f8a6a8f3bc07f7f0dffe8d"};
const app=initializeApp(cfg,"voworaGalleryMigration"),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("log").textContent="Login error: "+e.code}};
onAuthStateChanged(auth,u=>{if(u&&u.email==="srimalharsha@gmail.com"){$("login").hidden=true;$("work").hidden=false}else if(u){signOut(auth)}});
async function thumb(data){if(!data)return"";try{const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=data});const s=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.58)}catch(_){return""}}
$("runBtn").onclick=async()=>{const b=$("runBtn");b.disabled=true;let done=0;$("log").textContent="පැරණි Invitations කියවමින්...";try{const [ws,es]=await Promise.all([getDocs(collection(db,"publicWeddings")),getDocs(query(collection(db,"eventInvitations"),where("isActive","==",true)))]);for(const d of ws.docs){const x=d.data();if(x.published!==true)continue;const t=await thumb(x.cardDesignImage||x.couplePhotoUrl||"");await setDoc(doc(db,"galleryIndex",d.id),{kind:"wedding",category:"wedding",title:(x.brideName||"")+" & "+(x.groomName||""),eventDate:x.eventDate||"",venue:x.venue||"",thumbnail:t,published:true,updatedAt:serverTimestamp()});done++}for(const d of es.docs){const x=d.data(),t=await thumb(x.image||"");await setDoc(doc(db,"galleryIndex",d.id),{kind:"event",category:x.eventType||"other",title:x.title||"Special Event",hostName:x.hostName||"",eventDate:x.eventDate||"",venue:x.venue||"",thumbnail:t,active:true,updatedAt:serverTimestamp()});done++}$("log").textContent="සාර්ථකයි! "+done+" Invitations සඳහා කුඩා Gallery thumbnails සකස් කළා. දැන් Gallery එක නැවත විවෘත කරන්න."}catch(e){$("log").textContent="Migration error: "+(e.code||e.message)+"\nFirestore Rules Publish කර තිබේද බලන්න."}finally{b.disabled=false}};
</script></body></html>
