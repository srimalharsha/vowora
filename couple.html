<!doctype html>
<html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#302a27"><title>VOWORA | Guest Manager</title>
<style>
:root{--wine:#7b284f;--gold:#b58a54;--ink:#302a27;--muted:#796f68;--line:#eadbd5}*{box-sizing:border-box}body{margin:0;padding:14px;background:linear-gradient(135deg,#fffaf8,#f8eaf0);font-family:Arial,sans-serif;color:var(--ink)}.panel{max-width:820px;margin:15px auto;background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(17px,4vw,30px);box-shadow:0 15px 45px #4b273018}.brand{text-align:center;color:var(--wine);font: bold 28px Georgia;letter-spacing:5px}h1,h2{text-align:center;font-family:Georgia;font-weight:normal}.sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.couple{text-align:center;font:italic 28px Georgia;color:var(--wine);margin:18px 0}.box{background:#fffaf8;border:1px solid var(--line);padding:15px;border-radius:13px;margin:14px 0}label{display:block;font-weight:bold;font-size:13px;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #dfd2cc;border-radius:10px;font-size:15px}button,.btn{border:0;border-radius:10px;padding:12px 15px;background:var(--wine);color:white;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#766963}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.guest{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0}.guest a{color:var(--wine);overflow-wrap:anywhere}.muted{font-size:12px;color:var(--muted)}.status{font-size:12px;padding:5px 9px;border-radius:20px;background:#fff1d9}.yes{background:#e7f7eb}.no{background:#fae9e9}.msg{font-size:13px;color:#a83c45}.hidden{display:none}.small{text-align:center;font-size:11px;color:#897d76;margin-top:22px}
</style></head><body><main class="panel"><div class="brand">VOWORA</div><p class="sub">YOUR PRIVATE WEDDING GUEST MANAGER</p><div id="loading" class="sub">Invitation details ලබාගනිමින්...</div><section id="content" class="hidden"><div class="couple" id="coupleName"></div><p class="sub" id="eventInfo"></p><h1>ඔබගේ ආරාධිතයන්ට Invitation යවන්න</h1><div class="box"><form id="guestForm"><label>ආරාධනා කරන පුද්ගලයාගේ නම *</label><input id="guestName" maxlength="90" required placeholder="උදා: Kapila"><label>පවුලේ අයගේ නම් (අවශ්‍ය නම්)</label><input id="familyNames" maxlength="180" placeholder="උදා: නිමල්, කමලා සහ දරුවන්"><div class="row"><button id="generate">Generate Invitation Link</button></div></form><div id="msg" class="msg"></div></div><h2>Guest List & RSVP</h2><div id="guestSummary" class="box" aria-live="polite">තොරතුරු ගණනය කරමින්...</div><div id="guestList"></div></section><p class="small">Powered by SriHarsha Digital</p></main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";import{getFirestore,doc,getDoc,collection,addDoc,getDocs,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBodeTb_8XTiVO4ABEI8M5Ea30gFXrfrGc",authDomain:"vowora-6b0d1.firebaseapp.com",projectId:"vowora-6b0d1",storageBucket:"vowora-6b0d1.firebasestorage.app",messagingSenderId:"645328995192",appId:"1:645328995192:web:f8a6a8f3bc07f7f0dffe8d"},"voworaCouplePortal");const db=getFirestore(app),$=id=>document.getElementById(id),params=new URLSearchParams(location.search),portal=params.get("p");let wedding;
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function inviteUrl(id){return location.origin+location.pathname.replace(/couple\.html$/,"")+"invite.html?p="+portal+"&g="+id}
function phone(){return wedding.brideWhatsapp||wedding.groomWhatsapp||""}
async function loadGuests(){const list=$("guestList"),summary=$("guestSummary");try{const snap=await getDocs(collection(db,"couplePortals",portal,"guests"));list.innerHTML="";let yes=0,no=0,pending=0,people=0;snap.forEach(d=>{const g=d.data(),st=g.rsvpStatus||"pending";if(st==="yes"){yes++;people+=Math.max(1,Number(g.attendeeCount)||1)}else if(st==="no")no++;else pending++});summary.innerHTML="<b>මුළු ආරාධනා: "+snap.size+"</b><br>එනවා: "+yes+" දෙනෙක් / පුද්ගලයන් "+people+"<br>එන්නේ නැහැ: "+no+"<br>පිළිතුරු ලබා නොදුන්: "+pending;if(snap.empty){list.innerHTML="<p class='muted'>තවම Guest කෙනෙක් එකතු කර නැහැ.</p>";return}snap.forEach(d=>{const g=d.data(),url=inviteUrl(d.id),el=document.createElement("div");el.className="guest";const st=g.rsvpStatus||"pending";el.innerHTML="<b>"+esc(g.guestName)+"</b> <span class='status "+(st==="yes"?"yes":st==="no"?"no":"")+"'>"+(st==="yes"?"එනවා":st==="no"?"එන්නේ නැහැ":"පිළිතුරු නැහැ")+"</span><p class='muted'>"+esc(g.familyNames||"")+"</p><p><a target='_blank' href='"+url+"'>"+url+"</a></p><div class='row'><button data-copy='"+url+"'>Copy Link</button><button class='secondary' data-wa='"+url+"' data-name='"+esc(g.guestName)+"'>WhatsApp Share</button></div><p class='muted'>සහභාගී වන ගණන: "+Number(g.attendeeCount||0)+"</p>";list.append(el)});list.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.copy);b.textContent="Copied!"});list.querySelectorAll("[data-wa]").forEach(b=>b.onclick=()=>{const msg="ඔබට අපගේ Wedding Invitation එකයි: "+b.dataset.wa;window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank")})}catch(e){summary.textContent="සාරාංශය ලබාගත නොහැක";list.innerHTML="<p class='msg'>Guest List ලබාගත නොහැක: "+esc(e.code)+"</p>"}}
if(!portal){$("loading").textContent="වැරදි Invitation Link එකක්."}else{try{const snap=await getDoc(doc(db,"couplePortals",portal));if(!snap.exists())throw Error("not-found");wedding=snap.data();if(Date.now()>=wedding.expiresAt.toDate().getTime())throw Error("expired");$("loading").classList.add("hidden");$("content").classList.remove("hidden");$("coupleName").textContent=wedding.brideName+" & "+wedding.groomName;$("eventInfo").textContent=wedding.eventDate+" · "+wedding.eventTime+" · "+wedding.venue;await loadGuests()}catch(e){$("loading").textContent=e.message==="expired"?"මෙම Guest Manager Link එක කල් ඉකුත් වී ඇත. Wedding Album එක බලන්න.":"Invitation Link එක වලංගු නැත."}}
$("guestForm").addEventListener("submit",async e=>{e.preventDefault();if(!wedding)return;$("generate").disabled=true;try{const ref=await addDoc(collection(db,"couplePortals",portal,"guests"),{guestName:$("guestName").value.trim(),familyNames:$("familyNames").value.trim(),rsvpStatus:"pending",attendeeCount:0,createdAt:serverTimestamp()});const url=inviteUrl(ref.id);$("msg").innerHTML="Invitation Link එක සෑදුවා:<br><a target='_blank' href='"+url+"'>"+url+"</a>";await navigator.clipboard.writeText(url).catch(()=>{});$("guestForm").reset();await loadGuests()}catch(err){$("msg").textContent="Link එක සෑදිය නොහැක: "+err.code}finally{$("generate").disabled=false}});
</script></body></html>
