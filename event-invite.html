<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOWORA Event Invitation</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#f5e8e2,#e9d7d0);font-family:Georgia,serif;color:#493b37}.card{width:min(650px,100%);min-height:560px;background:#fffdf8;border:1px solid #c9a66b;box-shadow:0 20px 60px #493b3730;text-align:center;padding:42px 26px;display:flex;align-items:center;justify-content:center;flex-direction:column}.eyebrow{font:11px Arial;letter-spacing:3px;color:#9a7448}.title{font-size:clamp(30px,6vw,48px);font-weight:normal;color:#6e3449;margin:20px 0}.host{font-size:20px;color:#8b6848}.details{font:14px/2 Arial;white-space:pre-line;margin:20px}.message{font:15px/1.9 Arial;color:#75665f;white-space:pre-line}.photo{width:100%;max-height:280px;object-fit:cover;margin:15px 0}.map{margin-top:15px;padding:12px 17px;background:#6e3449;color:white;text-decoration:none;font:12px Arial}.footer{font:10px Arial;color:#988b80;margin-top:25px}.state{font:14px Arial;color:#6e3449}</style></head><body><main id="root" class="card"><div class="state">Invitation එක ලබාගනිමින්...</div></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBodeTb_8XTiVO4ABEI8M5Ea30gFXrfrGc",authDomain:"vowora-6b0d1.firebaseapp.com",projectId:"vowora-6b0d1",storageBucket:"vowora-6b0d1.firebasestorage.app",messagingSenderId:"645328995192",appId:"1:645328995192:web:f8a6a8f3bc07f7f0dffe8d"};
const app=initializeApp(cfg,"voworaEventInvite"),db=getFirestore(app),root=document.getElementById("root");
function add(tag,cls,value){const el=document.createElement(tag);if(cls)el.className=cls;if(value)el.textContent=value;root.append(el);return el}
const labels={birthday:"BIRTHDAY PARTY",engagement:"ENGAGEMENT", "grand-opening":"GRAND OPENING","sports-meet":"SPORTS MEET",anniversary:"ANNIVERSARY",graduation:"GRADUATION","baby-shower":"BABY SHOWER",corporate:"CORPORATE EVENT",other:"SPECIAL EVENT"};
const id=new URLSearchParams(location.search).get("id"),isPreview=new URLSearchParams(location.search).get("preview")==="admin";
let previewDraft=null;if(isPreview){try{previewDraft=JSON.parse(localStorage.getItem("vowora_event_invite_preview")||"null")}catch{}}
async function renderInvite(x,preview=false){root.innerHTML="";add("div","eyebrow",labels[x.eventType]||"SPECIAL EVENT");add("div","eyebrow","✦ ✧ ✦");add("h1","title",x.title||"You Are Invited");if(x.hostName)add("div","host",x.hostName);if(x.image){const im=add("img","photo");im.src=x.image;im.alt="Event image"}const date=x.eventDate?new Date(x.eventDate+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"}):"DATE";add("div","details",[date,x.eventTime||"TIME",x.venue||"VENUE"].filter(Boolean).join("\n"));if(x.description)add("p","message",x.description);if(x.mapUrl){const a=add("a","map","LOCATION & DIRECTIONS");a.href=x.mapUrl;a.target="_blank";a.rel="noopener"}if(preview)add("div","footer","PREVIEW ONLY · NOT PUBLISHED");add("div","footer","VOWORA · INVITATION WITH ELEGANCE")}
if(isPreview){if(previewDraft)await renderInvite(previewDraft,true);else root.textContent="Preview data ලබාගත නොහැක. Admin Panel එකෙන් නැවත Preview කරන්න."}
else if(!id){root.textContent="Invitation Link එක නිවැරදි නැත."}
else try{const snap=await getDoc(doc(db,"eventInvitations",id));if(!snap.exists()||!snap.data().isActive){root.textContent="මෙම Invitation එක ලබාගත නොහැක."}else await renderInvite(snap.data())}
catch(e){root.textContent="Invitation එක ලබාගැනීමේදී දෝෂයක් ඇතිවුණා: "+(e.code||"error")}
</script></body></html>
