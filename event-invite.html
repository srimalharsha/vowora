<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOWORA Event Invitation</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#f5e8e2,#e9d7d0);font-family:Georgia,serif;color:#493b37}.card{width:min(650px,100%);min-height:560px;background:#fffdf8;border:1px solid #c9a66b;box-shadow:0 20px 60px #493b3730;text-align:center;padding:42px 26px;display:flex;align-items:center;justify-content:center;flex-direction:column}.eyebrow{font:11px Arial;letter-spacing:3px;color:#9a7448}.title{font-size:clamp(30px,6vw,48px);font-weight:normal;color:#6e3449;margin:20px 0}.host{font-size:20px;color:#8b6848}.guest-greeting{font:italic 20px Georgia,serif;color:#9a7448;margin:4px 0 12px}.birthday-photo-wrap{position:relative;width:100%;max-width:560px;margin:18px auto 12px;overflow:hidden;border-radius:12px;isolation:isolate;box-shadow:0 12px 32px #493b3730}.birthday-photo{display:block;width:100%;height:clamp(300px,68vw,470px);max-height:470px;object-fit:cover}.birthday-photo-wrap:after{content:"";position:absolute;inset:25% 0 0;background:linear-gradient(180deg,transparent 0%,#160d12a8 48%,#160d12e8 100%);z-index:1}.birthday-overlay{position:absolute;z-index:2;left:18px;right:18px;bottom:22px;color:#fff;text-shadow:0 2px 8px #0008}.birthday-kicker{font:11px Arial,sans-serif;letter-spacing:4px;color:#ffe7c1;margin-bottom:8px}.birthday-person{font:clamp(30px,7vw,48px) Georgia,serif;line-height:1.08;color:#fff4dc;margin:0 0 10px;overflow-wrap:anywhere}.birthday-message{font:italic clamp(14px,3.4vw,18px)/1.55 Georgia,serif;color:#fff;max-width:470px;margin:0 auto}.birthday-sparkle{font-size:18px;margin-bottom:7px}.details{font:14px/2 Arial;white-space:pre-line;margin:20px}.message{font:15px/1.9 Arial;color:#75665f;white-space:pre-line}.photo{width:100%;max-height:280px;object-fit:cover;margin:15px 0}.map{margin-top:15px;padding:12px 17px;background:#6e3449;color:white;text-decoration:none;font:12px Arial}.footer{font:10px Arial;color:#988b80;margin-top:25px}.state{font:14px Arial;color:#6e3449}.music-toggle{position:fixed;top:14px;right:14px;z-index:10000;width:46px;height:46px;border:1px solid #c9a66b;border-radius:50%;background:#6e3449;color:#fff4dc;font:20px Arial;box-shadow:0 4px 16px #0004;cursor:pointer}.music-toggle[hidden]{display:none}</style></head><body><audio id="invitationMusic" preload="auto" loop></audio><button id="musicToggle" class="music-toggle" type="button" hidden aria-label="Play invitation music">▶</button><main id="root" class="card"><div class="state">Invitation එක ලබාගනිමින්...</div></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";import{getFirestore,doc,getDoc,collection,addDoc,getDocs,serverTimestamp,updateDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBodeTb_8XTiVO4ABEI8M5Ea30gFXrfrGc",authDomain:"vowora-6b0d1.firebaseapp.com",projectId:"vowora-6b0d1",storageBucket:"vowora-6b0d1.firebasestorage.app",messagingSenderId:"645328995192",appId:"1:645328995192:web:f8a6a8f3bc07f7f0dffe8d"};
const app=initializeApp(cfg,"voworaEventInvite"),db=getFirestore(app),root=document.getElementById("root");
function add(tag,cls,value){const el=document.createElement(tag);if(cls)el.className=cls;if(value)el.textContent=value;root.append(el);return el}
const labels={birthday:"BIRTHDAY PARTY",engagement:"ENGAGEMENT", "grand-opening":"GRAND OPENING","sports-meet":"SPORTS MEET",anniversary:"ANNIVERSARY",graduation:"GRADUATION","baby-shower":"BABY SHOWER",corporate:"CORPORATE EVENT",other:"SPECIAL EVENT"};
const params=new URLSearchParams(location.search),id=params.get("id"),guestId=params.get("g"),managerToken=params.get("master")||params.get("m"),isPreview=new URLSearchParams(location.search).get("preview")==="admin";
let previewDraft=null;if(isPreview){try{previewDraft=JSON.parse(localStorage.getItem("vowora_event_invite_preview")||"null")}catch{}}
function setupEventMusic(url){
 const audio=document.getElementById("invitationMusic"),button=document.getElementById("musicToggle"),src=String(url||"").trim();
 if(!audio||!button)return;
 if(!src){audio.pause();audio.removeAttribute("src");button.hidden=true;return}
 audio.src=src;audio.loop=true;button.hidden=false;
 const sync=()=>{const playing=!audio.paused;button.textContent=playing?"Ⅱ":"▶";button.setAttribute("aria-label",playing?"Pause invitation music":"Play invitation music");button.title=playing?"Pause music":"Play music"};
 button.onclick=async()=>{if(audio.paused){try{await audio.play();sync()}catch(e){sync()}}else{audio.pause();sync()}};
 audio.play().then(sync).catch(()=>{sync();button.title="Tap to play invitation music"});
 audio.addEventListener("play",sync);audio.addEventListener("pause",sync);
}
async function renderInvite(x,preview=false){root.innerHTML="";add("div","eyebrow",labels[x.eventType]||"SPECIAL EVENT");add("div","eyebrow","✦ ✧ ✦");add("h1","title",x.title||"You Are Invited");if(x.invitedGuestName)add("div","guest-greeting","Dear "+x.invitedGuestName);if(x.eventType!=="birthday"&&x.hostName)add("div","host",x.hostName);if(x.image){if(x.eventType==="birthday"){const wrap=add("div","birthday-photo-wrap");const im=document.createElement("img");im.className="birthday-photo";im.src=x.image;im.alt="Birthday celebration";const overlay=document.createElement("div");overlay.className="birthday-overlay";const sparkle=document.createElement("div");sparkle.className="birthday-sparkle";sparkle.textContent="✦  🎂  ✦";const kicker=document.createElement("div");kicker.className="birthday-kicker";kicker.textContent="HAPPY BIRTHDAY";const person=document.createElement("h2");person.className="birthday-person";person.textContent=x.birthdayName||x.hostName||"Birthday Star";const wish=document.createElement("p");wish.className="birthday-message";wish.textContent="May your special day be filled with love, laughter and beautiful memories. Keep shining and may all your dreams come true!";overlay.append(sparkle,kicker,person,wish);wrap.append(im,overlay)}else{const im=add("img","photo");im.src=x.image;im.alt="Event image"}}else if(x.eventType==="birthday"){const wrap=add("div","birthday-photo-wrap");wrap.style.minHeight="280px";wrap.style.background="linear-gradient(135deg,#8c5268,#d5a66e)";const overlay=document.createElement("div");overlay.className="birthday-overlay";const person=document.createElement("h2");person.className="birthday-person";person.textContent=x.birthdayName||x.hostName||"Birthday Star";const wish=document.createElement("p");wish.className="birthday-message";wish.textContent="May your special day be filled with love, laughter and beautiful memories. Keep shining and may all your dreams come true!";overlay.append(person,wish);wrap.append(overlay)}const date=x.eventDate?new Date(x.eventDate+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"}):"DATE";const details=x.eventType==="sports-meet"?["DATE: "+date,x.eventTime?"START TIME: "+x.eventTime:"",x.sportsGround?"SPORTS GROUND: "+x.sportsGround:"",x.venue?"LOCATION: "+x.venue:""]:[date,x.eventTime||"TIME",x.venue||"VENUE"];add("div","details",details.filter(Boolean).join("\n"));if(x.description)add("p","message",x.description);if(x.mapUrl){const a=add("a","map","LOCATION & DIRECTIONS");a.href=x.mapUrl;a.target="_blank";a.rel="noopener"}if(preview)add("div","footer","PREVIEW ONLY · NOT PUBLISHED");add("div","footer","VOWORA · INVITATION WITH ELEGANCE");setupEventMusic(x.musicUrl)}
function addGuestManager(){
 const panel=document.createElement("section");panel.style.cssText="width:100%;text-align:left;margin-top:24px;padding:20px;border-top:1px solid #d8c5b7;font:14px Arial";
 const heading=document.createElement("h2");heading.textContent="Guest Dashboard";heading.style.cssText="font:22px Georgia;color:#6e3449;text-align:center";
 const intro=document.createElement("p");intro.textContent="එක් එක් අමුත්තාගේ Invitation Link එක සහ ඔවුන්ගේ පැමිණීමේ පිළිතුර මෙතැනින් බලන්න.";
 const stats=document.createElement("div");stats.style.cssText="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0";
 const list=document.createElement("div");
 const form=document.createElement("form");form.style.cssText="display:grid;gap:9px;margin:16px 0";
 const label=document.createElement("label");label.textContent="ආරාධිතයාගේ නම";
 const name=document.createElement("input");name.required=true;name.maxLength=100;name.placeholder="උදා: Nimal Perera";name.style.cssText="padding:12px;border:1px solid #d8c5b7;border-radius:8px;font:15px Arial";
 const submit=document.createElement("button");submit.type="submit";submit.textContent="Generate Invitation Link";submit.style.cssText="padding:12px;border:0;border-radius:8px;background:#6e3449;color:white;font-weight:bold";
 const status=document.createElement("p");status.style.cssText="font:13px Arial;overflow-wrap:anywhere";
 const refreshBtn=document.createElement("button");refreshBtn.type="button";refreshBtn.textContent="Refresh Guest Status";refreshBtn.style.cssText="padding:9px 12px;background:#8b786e;color:white;border:0;border-radius:8px";
 form.append(label,name,submit);panel.append(heading,intro,stats,form,status,refreshBtn,list);root.append(panel);
 function stat(label,value){const box=document.createElement("div");box.style.cssText="background:#f8f1ed;border:1px solid #eadfd8;border-radius:10px;padding:12px;text-align:center";const n=document.createElement("strong");n.style.cssText="display:block;font: bold 24px Arial;color:#6e3449";n.textContent=String(value);const t=document.createElement("span");t.style.cssText="font:12px Arial;color:#75665f";t.textContent=label;box.append(n,t);return box}
 async function refresh(){
  list.replaceChildren();stats.replaceChildren();
  try{const snap=await getDocs(collection(db,"eventInvitationManagers",managerToken,"guests"));let yes=0,no=0,pending=0,total=0;
   snap.forEach(ds=>{const x=ds.data();if(x.rsvpStatus==="yes"){yes++;total+=Number(x.attendeeCount||1)}else if(x.rsvpStatus==="no")no++;else pending++});
   stats.append(stat("ආරාධනා කළ",snap.size),stat("එනවා කිව්වා",yes),stat("එන්නේ නැහැ කිව්වා",no),stat("පිළිතුරු නැහැ",pending),stat("සහභාගී වන මුළු ගණන",total));
   if(snap.empty){list.textContent="තවම Invitation Links සාදා නැහැ.";return}
   snap.forEach(ds=>{const x=ds.data(),line=document.createElement("div");line.style.cssText="border-top:1px solid #eadfd8;padding:12px 0;overflow-wrap:anywhere";
    const url=new URL("event-invite.html",location.href);url.searchParams.set("id",id);url.searchParams.set("master",managerToken);url.searchParams.set("g",ds.id);
    const strong=document.createElement("b");strong.textContent=x.guestName+" — ";
    const badge=document.createElement("span");badge.style.cssText="font-weight:bold;color:"+(x.rsvpStatus==="yes"?"#237447":x.rsvpStatus==="no"?"#a33d48":"#9a7448");
    badge.textContent=x.rsvpStatus==="yes"?"එනවා ("+(x.attendeeCount||1)+")":x.rsvpStatus==="no"?"එන්නේ නැහැ":"පිළිතුරු ලබාදී නැහැ";
    const a=document.createElement("a");a.href=url.href;a.target="_blank";a.textContent="Open Invitation";a.style.cssText="display:inline-block;margin-top:7px;color:#6e3449";
    const copy=document.createElement("button");copy.type="button";copy.textContent="Copy Link";copy.style.cssText="margin-left:8px;padding:7px 10px";copy.onclick=async()=>{await navigator.clipboard.writeText(url.href);copy.textContent="Copied"};
    const del=document.createElement("button");del.type="button";del.textContent="Delete";del.style.cssText="margin-left:6px;padding:7px 10px;background:#a33d48";del.onclick=async()=>{if(confirm("මෙම Invitation Link එක මකා දමන්නද?")){await deleteDoc(doc(db,"eventInvitationManagers",managerToken,"guests",ds.id));await refresh()}};
    line.append(strong,badge,document.createElement("br"),a,copy,del);list.append(line);
   });
  }catch(err){status.textContent="Guest List ලබාගත නොහැක: "+(err.code||err.message)}
 }
 refreshBtn.onclick=refresh;
 form.onsubmit=async ev=>{ev.preventDefault();submit.disabled=true;status.textContent="Link එක සාදමින්...";
  try{const guestName=name.value.trim();if(!guestName)throw Error("නම ඇතුළත් කරන්න.");const ref=await addDoc(collection(db,"eventInvitationManagers",managerToken,"guests"),{eventId:id,guestName,isActive:true,rsvpStatus:"pending",attendeeCount:0,createdAt:serverTimestamp()});const url=new URL("event-invite.html",location.href);url.searchParams.set("id",id);url.searchParams.set("master",managerToken);url.searchParams.set("g",ref.id);status.textContent="Invitation Link එක සෑදුවා: "+url.href;await navigator.clipboard.writeText(url.href).catch(()=>{});name.value="";await refresh();
  }catch(err){status.textContent="Link එක සෑදිය නොහැක: "+(err.code||err.message)}finally{submit.disabled=false}
 };
 refresh();
}
async function addGuestRsvp(guestRef,guestData){
 const panel=document.createElement("section");panel.style.cssText="width:100%;text-align:center;margin-top:22px;padding:18px;border-top:1px solid #d8c5b7;font:14px Arial";
 const heading=document.createElement("h2");heading.textContent="ඔබගේ පැමිණීම තහවුරු කරන්න";heading.style.cssText="font:22px Georgia;color:#6e3449";
 const note=document.createElement("p");note.textContent="කරුණාකර ඔබගේ පැමිණීම පිළිබඳ පිළිතුර ලබා දෙන්න.";
 const countLabel=document.createElement("label");countLabel.textContent="සහභාගී වන පුද්ගලයන් ගණන";
 const count=document.createElement("input");count.type="number";count.min="1";count.max="20";count.value=String(Math.max(1,Number(guestData.attendeeCount||1)));count.style.cssText="display:block;width:100%;max-width:180px;margin:8px auto 12px;padding:10px;border:1px solid #d8c5b7;border-radius:8px;text-align:center;font:16px Arial";
 const yes=document.createElement("button");yes.type="button";yes.textContent="ඔව්, අපි සහභාගී වෙනවා";yes.style.cssText="padding:12px;margin:5px;background:#237447;color:white;border:0;border-radius:8px";
 const no=document.createElement("button");no.type="button";no.textContent="කණගාටුයි, සහභාගී වෙන්නේ නැහැ";no.style.cssText="padding:12px;margin:5px;background:#8b786e;color:white;border:0;border-radius:8px";
 const status=document.createElement("p");status.style.cssText="font:13px Arial;color:#6e3449";
 if(guestData.rsvpStatus==="yes")status.textContent="ඔබගේ පිළිතුර: සහභාගී වෙනවා ("+(guestData.attendeeCount||1)+")";
 else if(guestData.rsvpStatus==="no")status.textContent="ඔබගේ පිළිතුර: සහභාගී වෙන්නේ නැහැ";
 yes.onclick=async()=>{const n=Number(count.value);if(!Number.isInteger(n)||n<1||n>20){status.textContent="පුද්ගලයන් ගණන 1 සිට 20 අතර ඇතුළත් කරන්න.";return}yes.disabled=true;no.disabled=true;try{await updateDoc(guestRef,{rsvpStatus:"yes",attendeeCount:n,rsvpAt:serverTimestamp()});status.textContent="ස්තුතියි! ඔබගේ පැමිණීම තහවුරු කළා."}catch(e){status.textContent="පිළිතුර Save කළ නොහැක: "+(e.code||e.message)}finally{yes.disabled=false;no.disabled=false}};
 no.onclick=async()=>{yes.disabled=true;no.disabled=true;try{await updateDoc(guestRef,{rsvpStatus:"no",attendeeCount:0,rsvpAt:serverTimestamp()});status.textContent="ඔබගේ පිළිතුර සටහන් කළා. ස්තුතියි!"}catch(e){status.textContent="පිළිතුර Save කළ නොහැක: "+(e.code||e.message)}finally{yes.disabled=false;no.disabled=false}};
 panel.append(heading,note,countLabel,count,yes,no,status);root.append(panel);
}
if(isPreview){if(previewDraft)await renderInvite(previewDraft,true);else root.textContent="Preview data ලබාගත නොහැක. Admin Panel එකෙන් නැවත Preview කරන්න."}
else if(!id){root.textContent="Invitation Link එක නිවැරදි නැත."}
else try{const snap=await getDoc(doc(db,"eventInvitations",id));if(!snap.exists()||!snap.data().isActive){root.textContent="මෙම Invitation එක ලබාගත නොහැක."}else{let data=snap.data();if(guestId){if(!managerToken)throw Error("invalid-guest-link");const guestSnap=await getDoc(doc(db,"eventInvitationManagers",managerToken,"guests",guestId));if(!guestSnap.exists()||!guestSnap.data().isActive||guestSnap.data().eventId!==id){root.textContent="මෙම පුද්ගලික Invitation Link එක ලබාගත නොහැක."}else{data={...data,invitedGuestName:guestSnap.data().guestName};await renderInvite(data);await addGuestRsvp(doc(db,"eventInvitationManagers",managerToken,"guests",guestId),guestSnap.data())}}else{await renderInvite(data);if(managerToken)addGuestManager()}}}
catch(e){root.textContent="Invitation එක ලබාගැනීමේදී දෝෂයක් ඇතිවුණා: "+(e.code||"error")}
</script></body></html>
