<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOWORA | Wedding Album</title><style>body{margin:0;padding:20px;background:#fbf8f3;color:#302a27;font-family:Georgia,serif}.wrap{max-width:900px;margin:auto}.brand{text-align:center;color:#7b284f;font-size:30px;letter-spacing:5px}h1{text-align:center;font-weight:normal}.sub{text-align:center;color:#796f68;font:13px Arial}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin-top:30px}.card{background:white;border:1px solid #eadbd5;padding:22px;text-align:center;border-radius:14px}.names{font:italic 25px Georgia;color:#7b284f}.details{font:13px/1.8 Arial;color:#796f68;margin:14px}.btn{display:inline-block;padding:10px 15px;background:#b58a54;color:white;text-decoration:none;font:12px Arial}</style></head><body><main class="wrap"><div class="brand">VOWORA</div><p class="sub">MEMORIES THAT LAST FOREVER</p><h1>Wedding Invitation Album</h1><p class="sub">අවසන් වූ උත්සවවල ආරාධනා එකතුව</p><div class="grid" id="album">Loading...</div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";import{getFirestore,collection,getDocs,query,where,Timestamp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyBodeTb_8XTiVO4ABEI8M5Ea30gFXrfrGc",authDomain:"vowora-6b0d1.firebaseapp.com",projectId:"vowora-6b0d1",storageBucket:"vowora-6b0d1.firebasestorage.app",messagingSenderId:"645328995192",appId:"1:645328995192:web:f8a6a8f3bc07f7f0dffe8d"},"voworaWeddingAlbum");const db=getFirestore(app),el=document.getElementById("album");function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}try{const snap=await getDocs(query(collection(db,"couplePortals"),where("expiresAt","<=",Timestamp.now())));el.innerHTML="";if(snap.empty)el.textContent="තවම Al
